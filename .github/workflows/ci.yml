name: CI Quality Gate — SmartWarehouse

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Lint, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer tout l'historique git (obligatoire pour SonarCloud)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Installer Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Installer les dépendances
      - name: Install dependencies
        run: npm ci

      # 4. Lancer ESLint — échoue si complexity > 5
      - name: Run ESLint
        run: npx eslint src/ routes/ --max-warnings=0

      # 5. Lancer les tests avec couverture (Jest)
      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=lcov

      # 6. Envoyer le rapport à SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}